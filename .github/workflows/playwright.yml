name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
  ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Run only test files changed by this push or pull request.
      - name: Find changed Playwright test files
        id: changed-tests
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "origin/$GITHUB_BASE_REF...$GITHUB_SHA" > changed-files.txt
          elif [[ "$GITHUB_EVENT_BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only HEAD^ HEAD > changed-files.txt
          else
            git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" > changed-files.txt
          fi

          grep -E '^tests/.*\.(spec|test)\.(js|ts|mjs|mts|jsx|tsx)$' changed-files.txt > changed-tests.txt || true
          echo "Changed test files:"
          cat changed-tests.txt || true

      - name: Run changed Playwright tests
        shell: bash
        run: |
          if [[ ! -s changed-tests.txt ]]; then
            echo "No Playwright test files changed; skipping test execution."
            exit 0
          fi

          mapfile -t test_files < changed-tests.txt
          npx playwright test "${test_files[@]}" --workers=4 --reporter=html,list

      - name: Upload downloadable Playwright report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload raw Allure results
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Install Allure TestOps CLI
        if: ${{ always() && !cancelled() && env.ALLURE_ENDPOINT != '' && env.ALLURE_PROJECT_ID != '' && env.ALLURE_TOKEN != '' }}
        run: |
          curl -fsSL https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 \
            -o "$RUNNER_TEMP/allurectl"
          chmod +x "$RUNNER_TEMP/allurectl"

      - name: Upload results to Allure TestOps
        if: ${{ always() && !cancelled() && env.ALLURE_ENDPOINT != '' && env.ALLURE_PROJECT_ID != '' && env.ALLURE_TOKEN != '' }}
        run: |
          "$RUNNER_TEMP/allurectl" upload allure-results \
            --endpoint "$ALLURE_ENDPOINT" \
            --project-id "$ALLURE_PROJECT_ID" \
            --token "$ALLURE_TOKEN" \
            --launch-name "Playwright ${{ github.workflow }} #${{ github.run_number }}"

      - name: Generate Allure report
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          if find allure-results -maxdepth 1 -name '*-result.json' -print -quit 2>/dev/null | grep -q .; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results found; creating an empty report directory."
            mkdir -p allure-report
          fi

      - name: Upload Allure Pages artifact
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  deploy-report:
    needs: test
    if: ${{ github.event_name == 'push' && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-manager:
    needs:
      - test
      - deploy-report
    if: ${{ always() && !cancelled() && needs.test.result == 'success' && (github.event_name == 'pull_request' || needs.deploy-report.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Email manager after successful pipeline
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_USERNAME }}
          to: nirviq@gmail.com
          subject: Playwright pipeline passed
          body: The Playwright GitHub Actions pipeline completed successfully.

  automated-api-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/osx_64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Run API tests
        run: |
          postman collection run "17849156-9e51fc07-2307-4ac4-b98b-f3c5e6238dcd"
